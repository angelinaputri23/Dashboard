  <div class="card"><h3>All products (${shown.length})</h3>${tbl(['Product','Operator','Type','Net qty','Net sales','Share','Weeks sold','Prev /day','Recent /day','Δ','Trend'],rows,[3,4,5,6,7,8,9])}</div>`+help('The table follows the filters above. “Weeks sold” = in how many of the selected weeks the product sold. Very low-volume products (under 5 pcs across the two periods) are left out of the rising/falling cards.')}
function tabCheck(){const ch=Object.entries(D.checks);
  const rows=ch.map(([s,v])=>{const bad=v.checks.filter(c=>c.totNa!==null&&Math.round(c.rowsNa)!==Math.round(c.totNa)).length,fx=v.checks.filter(c=>c.fixed).length,tot=sum(D.recs.filter(r=>r.store===s),r=>r.na);
    return[`<b>${esc(s)}</b>`,esc(v.tab),v.checks.length,v.rows,money(tot),bad?`<span class="dn">${bad} blocks don't match</span>`:'<span class="up">OK</span>',fx?`<span class="Stopped">${fx} block(s) adjusted</span>`:'–',D.dup.some(g=>g.includes(s))?'<span class="dn">identical to other branch</span>':'–']});
  const det=ch.map(([s,v])=>v.checks.filter(c=>c.fixed||c.dup||(c.totNa!==null&&Math.round(c.rowsNa)!==Math.round(c.totNa))).map(c=>[esc(s),c.range,c.fixed?'counted as '+c.used:c.dup?'ignored (duplicate)':'row sum ≠ 合計',money(c.rowsNa),c.totNa===null?'–':money(c.totNa)])).flat(),
  rets=D.recs.filter(r=>r.rq>0);
  return`<div class="card" style="margin-bottom:12px"><h3>Data status by branch</h3>${tbl(['Branch','Sheet tab','Weeks','Product rows','Net sales','Total check (合計)','Period fix','Duplicate check'],rows,[2,3,4])}</div>
  ${det.length?`<div class="card" style="margin-bottom:12px"><h3>Block notes</h3>${tbl(['Branch','Period in sheet','Treatment','Sum of rows','合計 row'],det,[3,4])}</div>`:''}
  <div class="grid">${card('Tab → branch mapping',tbl(['Tab','Branch'],CONFIG.STORES.map(s=>[esc(s.tab),esc(s.name)]))+'<div class="note warn">Daxue (811001 DT) and Hunei (829001 FN) are mapped from postal codes (811 Nanzi, 829 Hunei). Edit <code>STORES</code> in CONFIG if wrong.</div>')}
  ${card('Returns',rets.length?tbl(['Branch','Week','Product','Qty','Amount'],rets.map(r=>[esc(r.store),fd(r.ws),esc(r.label),f0(r.rq),money(r.ra)]),[3,4]):'<small>None retur.</small>')}</div>`}
/* ---------- render ---------- */
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==S.tab));
  if(!D.recs.length){$('#app').innerHTML='<div class="note warn">No data yet. Click “Upload .xlsx” or “Refresh from Google Sheets”.</div>';return}
  const fn={target:tabTarget,sales:tabSales,branch:tabBranch,prod:tabProd,check:tabCheck}[S.tab];
  const fc=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.k==='q';
  $('#app').innerHTML=banner()+fn();
  if(fc){const i=document.querySelector('input[data-k=q]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
/* ---------- load ---------- */
function embedded(){try{return JSON.parse(document.getElementById('embedded').textContent)}catch(e){return{}}}
function stamp(src){$('#status').textContent='Source: '+src+' · '+(D.weeks.length?fd(D.weeks[0].ws)+' – '+fd(D.weeks[D.weeks.length-1].we)+' '+D.weeks[D.weeks.length-1].we.slice(0,4)+' · ':'')+'updated '+new Date().toLocaleString('en-GB')}
async function loadLive(){const sheets={},fail=[];
  await Promise.all(CONFIG.STORES.map(async s=>{try{const t=await live(s.tab);if(isStoreTab(t))sheets[s.tab]=t;else fail.push(s.tab)}catch(e){fail.push(s.tab)}}));
  return{sheets,fail}}
async function load(manual){
  const btn=$('#refresh');btn.disabled=true;$('#status').textContent='Loading data…';
  try{
    let snap=embedded(),src='Embedded snapshot (xlsx)',warn='';try{const r=await fetch('data/snapshot.json?'+Date.now());if(r.ok){const j=await r.json();if(Object.keys(j).length){snap=j;src='Snapshot (data/snapshot.json)'}}}catch(e){}
    let sheets=snap;
    if(CONFIG.SHEET_ID&&(manual||CONFIG.AUTO_LIVE)){const {sheets:L,fail}=await loadLive();
      if(Object.keys(L).length&&!fail.length){sheets=L;src='Google Sheets (live)'}
      else if(Object.keys(L).length){sheets={...snap,...L};src='Google Sheets (live) · tabs failed to load: '+fail.join(', ')+' (using snapshot)'}
      else warn='⚠ Could not read Google Sheets (check sharing: “Anyone with the link – Viewer”). Using snapshot. · '}
    build(sheets);render();stamp(warn+src);
  }catch(e){$('#status').textContent='Error: '+e.message}
  btn.disabled=false}
async function loadFile(f){
  $('#status').textContent='Reading '+f.name+'…';
  try{const sheets=await readXlsx(await f.arrayBuffer());if(!Object.values(sheets).some(isStoreTab))throw Error('No sheet with columns 商品編號 / 銷售淨額');build(sheets);render();stamp('Upload: '+f.name)}
  catch(e){$('#status').textContent='⚠ Could not read file: '+e.message}}
document.addEventListener('click',e=>{const b=e.target.closest('#nav button');if(b){S.tab=b.dataset.tab;render()}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&k!=='q'){S[k]=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.k==='q'){S.q=e.target.value;render()}});
$('#refresh').onclick=()=>load(true);$('#upl').onclick=()=>$('#file').click();$('#file').onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value=''};
if(CONFIG.SHEET_ID)$('#gs').href='https://docs.google.com/spreadsheets/d/'+CONFIG.SHEET_ID+'/edit';else $('#gs').style.display='none';
load(false);
</script></body></html>
